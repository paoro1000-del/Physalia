# Include in the Nginx http {} context, then enable this access_log only for
# public application routes you own. Preserve the original path while removing
# query parameters, which may contain secrets. Protect this raw log because it
# still contains client IPs and paths.
# Behind a reverse proxy, configure Nginx's real_ip module only for explicitly
# trusted proxy addresses; do not trust arbitrary client-supplied X-Forwarded-For.
map $request_uri $adg_recon_uri {
  ~^([^?]*) $1;
}

log_format adg_recon escape=json
  '{"time":"$time_iso8601","host":"$server_name","client":"$remote_addr","method":"$request_method",'
  '"uri":"$adg_recon_uri","status":$status,"request_id":"$request_id"}';

# Example inside the intended server {} block:
# access_log /var/log/nginx/adg-recon.jsonl adg_recon;
