# Include log_format in nginx's http {} context; server {} is also inside http {}.
# Standalone loopback example; the TLS gateway must share this host.
# For a remote gateway, change both listen addresses to the same private
# interface and firewall access to that gateway; never expose this publicly.
# Put only deployment contents in /srv/adg/public.
# $limit_conn_status requires nginx 1.17.6 or newer.
log_format adg_json escape=json
  '{"time":"$time_iso8601","event":"decoy_contact","decoy_id":"archive-decoy-01",'
  '"request_id":"$request_id","method":"$request_method",'
  '"status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,'
  '"limit_req_status":"$limit_req_status","limit_conn_status":"$limit_conn_status"}';

# Apply before Host-based virtual-server selection, including the default server.
client_header_timeout 10s;

# Pace repeated retrievals from one source on the dedicated decoy listener.
# Behind a gateway this may be the gateway address; trust real-IP headers only
# from explicitly configured proxy addresses.
limit_req_zone $binary_remote_addr zone=adg_decoy:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=adg_decoy_client_conn:10m;
limit_conn_zone $server_name zone=adg_decoy_total_conn:1m;

# Reject DNS-rebinding and other requests with an unexpected Host header.
server {
    listen 127.0.0.1:9081 default_server;
    server_name _;
    return 444;
}

server {
    listen 127.0.0.1:9081;
    server_name localhost 127.0.0.1;
    root /srv/adg/public;
    autoindex off;
    server_tokens off;
    limit_req zone=adg_decoy burst=10;
    limit_req_status 429;
    # Bound slow or long-lived downloads per observed source and in total.
    # The global cap also applies when clients are distributed across IPs.
    limit_conn adg_decoy_client_conn 10;
    limit_conn adg_decoy_total_conn 50;
    limit_conn_status 429;
    # This is a retrieval-only decoy, not an upload endpoint. Bound request
    # bodies and slow body delivery before method rejection is completed.
    client_max_body_size 16k;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    # On platforms supporting openat/fstatat, do not follow symlinks outside root.
    disable_symlinks on;
    # Create this password file outside the web root using your existing tooling.
    auth_basic "Archive";
    auth_basic_user_file /etc/nginx/adg.htpasswd;
    # This sample omits paths and client addresses; assign a unique decoy_id
    # for each independently monitored decoy listener.
    access_log /var/log/nginx/adg-access.jsonl adg_json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    # Defense in depth; never put these files in the document root in the first place.
    # Also block common browser duplicate names such as archive.operator (1).json.
    location ~* \.(operator|inventory)( \([1-9][0-9]*\))?\.json$ { deny all; }
    # Settings retain custom free-text values and must stay private as well.
    # Match the known filename at any depth below the document root.
    location ~* (^|/)adg-settings( \([1-9][0-9]*\))?\.json$ { deny all; }
    # Do not expose repository metadata even if the document root is misconfigured.
    location ~* (^|/)\.(git|svn|hg)(/|$) { deny all; }
    # Static decoy content is read-only; expose only retrieval methods.
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
