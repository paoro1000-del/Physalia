# Example only. Include log_format, limit_req_zone and limit_conn_zone in
# nginx's http {} context
# and the server block inside http {}. Both sample listeners use loopback, so
# the TLS gateway must run on the same host. For a remote gateway, bind this
# server to a private interface and firewall it to that gateway; never expose
# it directly to the public network.
# $limit_conn_status requires nginx 1.17.6 or newer.
log_format adg_stream escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","path":"$uri",'
  '"status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,'
  '"limit_req_status":"$limit_req_status","limit_conn_status":"$limit_conn_status"}';

# Apply before Host-based virtual-server selection, including the default server.
client_header_timeout 10s;

# Tune for the expected client population. Nginx limits by the source address
# it sees; behind a gateway this may be the gateway, not the original client.
# Configure real-IP handling only for explicitly trusted proxy addresses.
# This only slows repeated requests and is not a substitute for strong auth.
limit_req_zone $binary_remote_addr zone=adg_stream_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=adg_stream_per_source:10m;
limit_conn_zone $server_name zone=adg_stream_global:1m;

# Reject DNS-rebinding and other requests with an unexpected Host header.
server {
    listen 127.0.0.1:9082 default_server;
    server_name _;
    return 444;
}

server {
    listen 127.0.0.1:9082;
    server_name localhost 127.0.0.1;
    server_tokens off;
    auth_basic "Archive download";
    # Create this hashed password file outside the web root with your existing
    # htpasswd tooling; restrict read access to the nginx service account.
    auth_basic_user_file /etc/nginx/adg-stream.htpasswd;
    # GET/HEAD can still carry request bodies. Bound and discard them at the
    # proxy; this endpoint only streams a response and accepts no upload data.
    client_max_body_size 16k;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    # The generator permits at most 8 backend streams. Cap concurrent stream
    # requests at that ceiling to avoid consuming excess proxy and backend
    # handler slots. The backend's configured max_streams may be lower.
    # Nginx starts counting after request headers are fully received; the
    # client_header_timeout above also bounds slow header delivery.
    limit_conn adg_stream_per_source 8;
    limit_conn adg_stream_global 8;
    limit_conn_status 429;
    # This privacy-minimal sample log omits client IP and auth identity. Nginx
    # normally writes it when the response ends, so use protected gateway/auth
    # request-start logs for prompt detection and attribution when required.
    access_log /var/log/nginx/adg-stream-access.jsonl adg_stream;

    # Match the stream_config.json path and port. The proxy authenticates the
    # client with Basic auth, then replaces Authorization with the backend's
    # access token. Create this include outside the repository and restrict it.
    location = /exports/archive.sql {
        # This endpoint only delivers a stream; never forward request bodies.
        limit_except GET HEAD { deny all; }
        limit_req zone=adg_stream_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:9080;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        # Keep this alongside the location-level proxy_set_header directives;
        # Nginx does not merge them with proxy_set_header from the server level.
        include /etc/nginx/adg-stream-token.conf;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # These are inactivity-gap limits, not total response-age limits.
        # Check any separate absolute request-duration cap in the outer gateway.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        send_timeout 1h;
        proxy_ignore_client_abort off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Never expose operator endpoints through this client-facing listener.
    location = /stop { return 404; }
    location = /health { return 404; }
    location / { return 404; }
}
